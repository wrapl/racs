<html lang="en" xmlns="http://www.w3.org/1999/xhtml"> 
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="/bulma.min.css"/>
	<link rel="stylesheet" href="/bulmaswatch.min.css"/>
	<link rel="stylesheet" href="/css/all.min.css"/>
	<script src="/lib.js" type="text/javascript"/>
	<script src="/ansi_up.js" type="text/javascript"/>
	<script src="/luxon.min.js" type="text/javascript"/>
	<link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png"/>
	<link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png"/>
	<link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png"/>
	<link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png"/>
	<link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png"/>
	<link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png"/>
	<link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png"/>
	<link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png"/>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png"/>
	<link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png"/>
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
	<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<meta name="msapplication-TileColor" content="#ffffff"/>
	<meta name="msapplication-TileImage" content="/ms-icon-144x144.png"/>
	<meta name="theme-color" content="#ffffff"/>

		.modal-card-body {
			height: 33em;
		}
	</style>
</head>
<body class="has-background-warning-light" style="min-height:100vh;padding:0;">
	<div class="modal" id="create">
		<div class="modal-background"/>
		<form class="modal-card" action="/registry/create" method="POST">
			<header class="modal-card-head">
				<p class="modal-card-title">Create Registry</p>
				<button class="delete" aria-label="close" onclick="hideCreate()" type="reset"/>
			</header>
			<section class="modal-card-body">
				<input type="hidden" name="redirect" value="/registries.xhtml"/>
				<div class="field">
					<label class="label">Name</label>
					<div class="control">
						<input class="input" name="name"/>
					</div>
				</div>
				<div class="field">
					<label class="label">URL</label>
					<div class="control">
						<input class="input" name="url"/>
					</div>
				</div>
				<div class="field">
					<label class="label">User</label>
					<div class="control">
						<input class="input" name="user"/>
					</div>
				</div>
				<div class="field">
					<label class="label">Credential</label>
					<div class="control">
						<select class="select" name="credential" id="create_credential"/>
					</div>
				</div>
			</section>
			<footer class="modal-card-foot">
				<span style="flex:1 1;"/>
				<button class="button" onclick="hideCreate()" type="reset">Cancel</button>
				<button class="button is-primary" type="submit">Create</button>
			</footer>
		</form>
	</div>
	<div class="modal" id="settings">
		<div class="modal-background"/>
		<div class="modal-card">
			<header class="modal-card-head">
				<p class="modal-card-title">
					<div class="tabs is-centered is-toggle">
						<ul id="registry_settings_tabs">
							<li><a onclick="showSettingsTab(0)">Settings</a></li>
							<li><a onclick="showSettingsTab(1)">Usage</a></li>
							<li><a onclick="showSettingsTab(2)">Delete</a></li>
						</ul>
					</div>
				</p>
				<button class="delete" aria-label="close" onclick="hideSettings()" type="reset"/>
			</header>
			<div id="registry_settings_container">
				<form action="/registry/update" method="POST">
					<section class="modal-card-body">
						<input type="hidden" name="redirect" value="/registries.xhtml"/>
						<input type="hidden" name="id" id="update_id" value=""/>
						<div class="field">
							<label class="label">Name</label>
							<div class="control">
								<input class="input" name="name" id="update_name"/>
							</div>
						</div>
						<div class="field">
							<label class="label">URL</label>
							<div class="control">
								<input class="input" name="url" id="update_url"/>
							</div>
						</div>
						<div class="field">
							<label class="label">User</label>
							<div class="control">
								<input class="input" name="user" id="update_user"/>
							</div>
						</div>
						<div class="field">
							<label class="label">Credential</label>
							<div class="control">
								<select class="select" name="credential" id="update_credential"/>
							</div>
						</div>
						<div class="field">
							<label class="label">Timeout</label>
							<div class="control">
								<input class="input" type="number" name="timeout" id="update_timeout"/>
							</div>
						</div>
						<div class="field">
							<label class="label">Login</label>
							<div class="control">
								<span id="update_login"/>
							</div>
						</div>
					</section>
					<footer class="modal-card-foot">
						<span style="flex:1 1;"/>
						<button class="button" onclick="hideSettings()" type="reset">Cancel</button>
						<button class="button is-primary" type="submit">Update</button>
					</footer>
				</form>
				<div>
					<section class="modal-card-body">
						<table class="table is-fullwidth">
							<tbody id="uses_table"/>
						</table>
					</section>
					<footer class="modal-card-foot">
						<span style="flex:1 1;"/>
						<button class="button" onclick="hideSettings()" type="reset">Cancel</button>
					</footer>
				</div>
				<form action="/registry/delete" method="POST">
					<section class="modal-card-body">
						<input type="hidden" name="redirect" value="/registries.xhtml"/>
						<input type="hidden" name="id" id="delete_id" value=""/>
						<div class="field">
							<label class="label">Type "YES" to confirm</label>
							<div class="control">
								<input class="input" name="confirm" id="delete_confirm"/>
							</div>
						</div>
					</section>
					<footer class="modal-card-foot">
						<span style="flex:1 1;"/>
						<button class="button" onclick="hideSettings()" type="reset">Cancel</button>
						<button class="button is-danger" type="submit">Delete</button>
					</footer>
				</form>
			</div>
		</div>
	</div>
	<div class="modal" id="logout">
		<div class="modal-background"/>
		<form class="modal-card" action="/user/logout" method="POST">
			<input type="hidden" name="redirect" value="/registries.xhtml"/>
			<header class="modal-card-head">
				<p class="modal-card-title">Login</p>
				<button class="delete" aria-label="close" type="reset"/>
			</header>
			<footer class="modal-card-foot">
				<span style="flex:1 1;"/>
				<button class="button" onclick="hideLogout()" type="reset">Cancel</button>
				<button class="button is-primary" type="submit">Logout</button>
			</footer>
		</form>
	</div>
	<nav class="navbar is-radiusless" role="navigation" aria-label="main navigation" style="position:sticky;top:0">
		<div class="navbar-brand">
			<a class="navbar-item" href="/">
				<img src="/favicon-96x96.png"/>
				<span class="is-size-4 ml-2 has-text-info has-text-weight-bold is-family-code">RACS</span>
			</a>
			<a class="navbar-item is-tab" href="/">Projects</a>
			<a class="navbar-item is-tab" href="/credentials.xhtml">Credentials</a>
			<a class="navbar-item is-tab is-active" href="/registries.xhtml">Registries</a>
			<a class="navbar-item is-tab" href="/tasks.xhtml">Tasks</a>
			<a class="navbar-item is-tab" href="/graph.xhtml">Graph</a>
			<a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" id="navbar-burger">
				<span aria-hidden="true"></span>
				<span aria-hidden="true"></span>
				<span aria-hidden="true"></span>
			</a>
		</div>
		<div class="navbar-menu" id="navbar-menu">
			<div class="navbar-end">
				<div class="navbar-item" id="out-actions" style="display:none;">
					<div class="buttons">
						<button class="button is-small is-primary" onclick="showLogin()">Login</button>
					</div>
				</div>
				<div class="navbar-item" id="in-actions" style="display:none;">
					<div class="buttons">
						<button class="button is-small" onclick="showCreate()">Create Regsitry</button>
						<button class="button is-small is-danger" onclick="showLogout()">Logout</button>
					</div>
				</div>
			</div>
		</div>
	</nav>
	<table class="table" style="margin:auto;" id="registries"/>
	<script type="text/javascript">
		let burger = document.getElementById("navbar-burger");
		burger.onclick = function(event) {
			let menu = document.getElementById("navbar-menu");
			burger.classList.toggle("is-active");
			menu.classList.toggle("is-active");
		}
		function showCreate() {
			var select = document.getElementById("create_credential");
			select.removeChildren();
			select.appendChild(create("option", {value: ""}, "--- Credential ---"));
			select.appendChildren(credentials.map(credential => create("option", {value: credential.id}, credential.name)));
			var modal = document.getElementById("create");
			modal.addClass("is-active");
		}
		
		function hideCreate() {
			var modal = document.getElementById("create");
			modal.removeClass("is-active");
		}

		function showSettingsTab(index) {
			var tabs = document.getElementById("registry_settings_tabs");
			var container = document.getElementById("registry_settings_container");
			for (var i = 0; i &lt; 3; ++i) {
				tabs.children[i].removeClass("is-active");
				container.children[i].style.display = "none";
			}
			tabs.children[index].addClass("is-active");
			container.children[index].style.display = null;
		}

		function showSettings() {
			document.getElementById("update_id").value = this.id;
			document.getElementById("update_name").value = this.name;
			document.getElementById("update_url").value = this.url;
			document.getElementById("update_user").value = this.user;
			var select = document.getElementById("update_credential");
			select.removeChildren();
			select.appendChild(create("option", {value: ""}, "--- Credential ---"));
			select.appendChildren(credentials.map(credential => create("option", {value: credential.id}, credential.name)));
			select.value = (this.credential || "").toString();
			document.getElementById("update_timeout").value = this.timeout;
			document.getElementById("update_login").textContent = this.login;
			var uses = document.getElementById("uses_table");
			while (uses.firstChild) uses.removeChild(uses.firstChild);
			projects.forEach(project => {
				project.destinations.forEach(destination => {
					if (destination[0] == this.id) {
						var row = create("tr",
							create("td", create("span", `Project #${project.id}`)),
							create("td", create("span", project.name)),
							create("td", create("span", `-> ${destination[1]}`))
						);
						uses.appendChild(row);
					}
				});
				for (var stage in project.sources) {
					if (project.sources[stage] == this.id) {
						var row = create("tr",
							create("td", create("span", `Project #${project.id}`)),
							create("td", create("span", project.name)),
							create("td", create("span", `${stage} ->`))
						);
						uses.appendChild(row);
					}
				}
			});
			document.getElementById("delete_id").value = this.id;
			document.getElementById("delete_confirm").value = "";
			var modal = document.getElementById("settings");
			modal.addClass("is-active");
			showSettingsTab(0);
		}

		function hideSettings() {
			var modal = document.getElementById("settings");
			modal.removeClass("is-active");
		}
		
		function showLogin() {
			location = `/login?redirect=${location.pathname}`
		}
		
		function showLogout() {
			var modal = document.getElementById("logout");
			modal.addClass("is-active");
		}
		
		function hideLogout() {
			var modal = document.getElementById("logout");
			modal.removeClass("is-active");
		}
		
		var container = document.getElementById("registries");
		var registries = [];
		var credentials = [];
		var projects = [];

		function updateRegistry(result) {
			var registry = registries[result.id];
			if (!registry) {
				registry = registries[result.id] = {};
				registry.name = result.name;
				var card = create("tr",
					create("th", result.name),
					create("td",
						create("button.button.is-small", {"on-click": showSettings.bind(result)},
							create("span.icon", create("i.fas.fa-tools"))
						)
					)
				);
				container.appendChild(card);
			}
		}

		function updateProject(result) {
			for (var i = 0; i &lt; projects.length; ++i) {
				var project = projects[i];
				if (project.id == result.id) {
					for (var key in result) project[key] = result[key];
					return;
				}
			}
			projects.push(result);
		}
		
		function updateUser(name) {
			console.log("User = ", name);
			window.user = name;
			var inActions = document.getElementById("in-actions");
			var outActions = document.getElementById("out-actions");
			if (name) {
				inActions.style.display = null;
				outActions.style.display = "none";
			} else {
				inActions.style.display = "none";
				outActions.style.display = null;
			}
		}
		
		var events = null;

		function connectEvents() {
			events = new EventSource("/events");
			events.onmessage = function(e) {
				var event = JSON.parse(e.data);
				console.log(event);
				switch (event.event) {
				case "project/list":
					event.projects.forEach(updateProject);
					break;
				case "project/create":
				case "project/state":
				case "project/version":
				case "project/update":
					updateProject(event);
					break;
				case "task/create":
				case "task/state":
					//var project = projects[event.project];
					//if (project) updateTask(project, event);
					break;
				case "credential/list":
					credentials = event.credentials;
					break;
				case "registry/list":
					event.registries.forEach(updateRegistry);
					break;
				case "user/current":
					updateUser(event.user);
					break;
				}
			}
		}

		connectEvents();
	</script>
</body>
</html>
