<html lang="en" xmlns="http://www.w3.org/1999/xhtml"> 
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="stylesheet" href="/bulma.min.css"/>
	<link rel="stylesheet" href="/bulmaswatch.min.css"/>
	<script src="/lib.js" type="text/javascript"/>
	<script src="/ansi_up.js" type="text/javascript"/>
	<link rel="apple-touch-icon" sizes="57x57" href="/apple-icon-57x57.png"/>
	<link rel="apple-touch-icon" sizes="60x60" href="/apple-icon-60x60.png"/>
	<link rel="apple-touch-icon" sizes="72x72" href="/apple-icon-72x72.png"/>
	<link rel="apple-touch-icon" sizes="76x76" href="/apple-icon-76x76.png"/>
	<link rel="apple-touch-icon" sizes="114x114" href="/apple-icon-114x114.png"/>
	<link rel="apple-touch-icon" sizes="120x120" href="/apple-icon-120x120.png"/>
	<link rel="apple-touch-icon" sizes="144x144" href="/apple-icon-144x144.png"/>
	<link rel="apple-touch-icon" sizes="152x152" href="/apple-icon-152x152.png"/>
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180x180.png"/>
	<link rel="icon" type="image/png" sizes="192x192"  href="/android-icon-192x192.png"/>
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
	<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png"/>
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<meta name="msapplication-TileColor" content="#ffffff"/>
	<meta name="msapplication-TileImage" content="/ms-icon-144x144.png"/>
	<meta name="theme-color" content="#ffffff"/>
</head>
<body>
	<div class="modal is-active">
		<div class="modal-background"/>
		<form class="modal-card" action="/user/login" method="POST" id="login">
			<header class="modal-card-head">
				<p class="modal-card-title">Login</p>
				<button class="delete" aria-label="close" type="reset"/>
			</header>
			<section class="modal-card-body">
				<input type="hidden" name="action" value="{{.action}}"/>
				<input type="hidden" name="params" value="{{.params | html}}"/>
				{{if .use_sso}}<input type="hidden" name="sso_code" id="sso_code"/>{{end}}
				<div class="field is-horizontal">
					<div class="field-label is-normal">
						<label class="label">User Name</label>
					</div>
					<div class="field-body">
						<div class="field">
							<div class="control is-expanded">
								<input class="input" name="username"/>
							</div>
						</div>
					</div>
				</div>
				<div class="field is-horizontal">
					<div class="field-label is-normal">
						<label class="label">Password</label>
					</div>
					<div class="field-body">
						<div class="field">
							<div class="control is-expanded">
								<input class="input" type="password" name="password"/>
							</div>
						</div>
					</div>
				</div>
			</section>
			<footer class="modal-card-foot">
				<span style="flex:1 1;"/>
				<button class="button" type="reset" onclick="window.history.back();">Cancel</button>
				{{if .use_sso}}<button class="button is-info" onclick="sso_login(event)" type="reset">SSO</button>{{end}}
				<button class="button is-primary" type="submit">Login</button>
			</footer>
		</form>
	</div>
	<script>
		function sso_login(event) {
			event.preventDefault();
			let child = open("{{.sso_url | html}}&amp;redirect_uri=" + location.origin + "/sso.xhtml", "_blank", "popup");
		}

		window.sso_callback = function(data) {
			let url = new URL(data);
			console.log(url.searchParams.get("state"));
			document.getElementById("sso_code").value = url.searchParams.get("code");
			document.getElementById("login").submit();
		};
	</script>
</body>
</html>
